name: Endpoint parity

on:
  push:
    paths:
      - "ohdsi-atlas-client/src/ohdsi_atlas_client/data/endpoints.json"
      - "OhdsiAtlasClient/inst/extdata/endpoints.json"
      - "scripts/**"
      - ".github/workflows/endpoint-parity.yml"
  pull_request:
    paths:
      - "ohdsi-atlas-client/src/ohdsi_atlas_client/data/endpoints.json"
      - "OhdsiAtlasClient/inst/extdata/endpoints.json"
      - "scripts/**"
      - ".github/workflows/endpoint-parity.yml"

permissions:
  contents: read

jobs:
  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Sync catalogs
        run: python scripts/sync_endpoints.py
      - name: Fail on drift
        run: git diff --exit-code -- r/inst/extdata/endpoints.json
      - name: Repository checks
        run: python scripts/check_repo.py
