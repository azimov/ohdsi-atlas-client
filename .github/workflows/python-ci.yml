name: Python

on:
  push:
    paths:
      - "ohdsi-atlas-client/**"
      - "scripts/**"
      - ".github/workflows/python-ci.yml"
  pull_request:
    paths:
      - "ohdsi-atlas-client/**"
      - "scripts/**"
      - ".github/workflows/python-ci.yml"

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12"]
    defaults:
      run:
        working-directory: ohdsi-atlas-client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,circe,keyring]"
      - name: Ruff
        run: ruff check .
      - name: Mypy
        run: mypy src
      - name: Pytest (offline)
        run: pytest -q
      - name: Build wheel
        run: python -m build --wheel
      - name: Check wheel contents
        run: |
          python - <<'PY'
          import glob, zipfile
          wheel = glob.glob("dist/*.whl")[0]
          names = zipfile.ZipFile(wheel).namelist()
          assert "ohdsi_atlas_client/data/endpoints.json" in names, names
          print(f"{wheel}: {len(names)} files")
          PY

  integration:
    name: Live integration (optional)
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ohdsi-atlas-client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev,circe]"
      - run: pytest -q -m integration
        env:
          OHDSI_ATLAS_CLIENT_TEST_URL: ${{ secrets.OHDSI_ATLAS_CLIENT_TEST_URL }}
          OHDSI_ATLAS_CLIENT_TEST_API_KEY: ${{ secrets.OHDSI_ATLAS_CLIENT_TEST_API_KEY }}
          OHDSI_ATLAS_CLIENT_TEST_SOURCE: ${{ vars.OHDSI_ATLAS_CLIENT_TEST_SOURCE }}
