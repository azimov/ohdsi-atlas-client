name: Live integration

on:
  workflow_dispatch:
    inputs:
      source:
        description: CDM source key
        required: false
        default: EUNOMIA

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev,circe]"
      - run: pytest -q -m integration
        env:
          ATLAS3_TEST_URL: ${{ secrets.ATLAS3_TEST_URL }}
          ATLAS3_TEST_USERNAME: ${{ secrets.ATLAS3_TEST_USERNAME }}
          ATLAS3_TEST_PASSWORD: ${{ secrets.ATLAS3_TEST_PASSWORD }}
          ATLAS3_TEST_SOURCE: ${{ inputs.source }}

  r:
    runs-on: ubuntu-latest
    env:
      ATLAS3_TEST_URL: ${{ secrets.ATLAS3_TEST_URL }}
      ATLAS3_TEST_USERNAME: ${{ secrets.ATLAS3_TEST_USERNAME }}
      ATLAS3_TEST_PASSWORD: ${{ secrets.ATLAS3_TEST_PASSWORD }}
      ATLAS3_TEST_SOURCE: ${{ inputs.source }}
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: r
          extra-packages: any::devtools, any::testthat, any::keyring
      - name: Test
        run: Rscript -e 'devtools::test("r", filter = "integration")'
